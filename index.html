<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IA UMB — Un Monde Bouge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<header><div class="logo">UMB <span>IA</span></div><div class="status">● EN LIGNE</div></header>
<section class="hero"><h1>IA UMB</h1><p>Une intelligence citoyenne conçue pour comprendre le contexte, raisonner et répondre utilement.</p></section>
<section id="chat" class="chat" aria-live="polite">
<div class="msg ai"><b>IA UMB</b><p>Bonjour. Pose-moi ta question.</p></div>
</section>
<form id="form" class="inputbar">
<textarea id="message" rows="1" placeholder="Écris ta question..." required></textarea>
<button>Envoyer</button>
</form>
<p class="note">Interface UMB — la connexion au moteur IA se fait via le serveur UMB. Aucune clé secrète n’est stockée dans cette page.</p>
</main>
<script src="app.js"></script>
</body>
</html>
